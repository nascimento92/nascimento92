# Galaxy Profile README Configuration
# Copy this file to config.yml and customize it to make it your own!
#
# Usage:
#   cp config.example.yml config.yml
#   # Edit config.yml with your details
#   python -m generator.main
#
# Demo mode (no API calls, uses this file directly):
#   python -m generator.main --demo

# Your GitHub username (required)
username: nascimento92

# Profile information displayed in the galaxy header
profile:
  name: "Gabriel Nascimento"
  tagline: "Full Stack Developer & Tech Lead"
  company: "@GRAN COFFEE"
  location: "Campinas, SP"
  bio: |
    Building tools that make users happy.
  philosophy: '"The best code is the code that empowers others."'

# Social links displayed at the bottom of the profile
social:
  email: ""
  linkedin: "gabriel-nascimento-62959379"
  website: "https://www.linkedin.com/in/gabriel-nascimento-62959379/"

# Galaxy arms represent your core focus areas
# Each arm spirals out from the center with its own color and tech items
# Available colors: "synapse_cyan", "dendrite_violet", "axon_amber"
galaxy_arms:
  - name: "Frontend"
    color: "dendrite_violet"
    items:
      - "TypeScript"
      - "React"
      - "CSS"
  - name: "Backend"
    color: "synapse_cyan"
    items:
      - "Python"
      - "Node.js"
      - "PostgreSQL"
  - name: "DevOps"
    color: "axon_amber"
    items:
      - "Docker"
      - "GitHub Actions"
      - "AWS"

# Featured projects shown as constellation stars
# Each project needs:
#   repo: "owner/repo-name"   — GitHub repository path
#   arm: 0-2                  — Which galaxy arm to associate with (index)
#   description: "..."        — Short description shown on the card
projects:
  - repo: "departamentoTiGrancoffee/portal_grancoffee"
    arm: 0
    description: "Portal corporativo Gran Coffee — frontend TypeScript com múltiplos módulos internos."
  - repo: "departamentoTiGrancoffee/roteirizacao-abastecedores"
    arm: 0
    description: "Ferramenta web para criação de roteiros otimizados para a equipe de abastecedores."
  - repo: "departamentoTiGrancoffee/gran-helper"
    arm: 1
    description: "API de serviços globais (login Sankhya, integrações) usada por todos os workers internos."
  - repo: "departamentoTiGrancoffee/gama-talk"
    arm: 1
    description: "Chatbot com IA para atendimento e automação de fluxos da Gran Coffee."
  - repo: "departamentoTiGrancoffee/worker-hera"
    arm: 1
    description: "Worker TypeScript para processamento de rotinas internas da Gran Coffee."
  - repo: "departamentoTiGrancoffee/broker-mqtt"
    arm: 2
    description: "Broker MQTT interno para comunicação IoT entre projetos e dispositivos da Gran Coffee."
  - repo: "departamentoTiGrancoffee/grafana"
    arm: 2
    description: "Setup do Grafana para observabilidade e dashboards de monitoramento das aplicações internas."

# Theme color overrides (optional — defaults to deep space palette)
# All values must be valid hex color codes (#RRGGBB)
theme:
  void: "#080c14"              # Darkest background
  nebula: "#0f1623"            # Card backgrounds
  star_dust: "#1a2332"         # Borders, dividers
  synapse_cyan: "#00d4ff"      # Primary accent (arm color 1)
  dendrite_violet: "#a78bfa"   # Secondary accent (arm color 2)
  axon_amber: "#ffb020"        # Tertiary accent (arm color 3)
  text_bright: "#f1f5f9"       # Primary text
  text_dim: "#94a3b8"          # Secondary text
  text_faint: "#64748b"        # Muted text, labels

# Stats configuration — which metrics to show on the telemetry card
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Language display settings
languages:
  exclude:                     # Languages to hide from the telemetry chart
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
  max_display: 8               # Maximum number of languages to show
